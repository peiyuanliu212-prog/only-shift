let tutIdx = 0;
function tutSteps(){ return TUT[levelIdx] || []; }
function tutCurrent(){
  const steps = tutSteps();
  if (tutIdx >= steps.length) return null;
  const s = steps[tutIdx];
  return player.x >= (s.at || 0) ? s : null;
}
function tutAdvance(){
  const s = tutCurrent();
  if (!s) return;
  if (s.done.x !== undefined && player.x >= s.done.x) tutIdx++;
  else if (s.done.ring !== undefined && ring === s.done.ring) tutIdx++;
}

let deaths = 0;

/* 进度存档：已解锁到的最高关卡序号。写失败绝不堵流程（存档纪律 B7）——
   读不到就从第 1 关开始，写不进就只当本次会话有效。 */
let unlocked = 0;
try { unlocked = Math.max(0, Math.min(LEVELS.length - 1, parseInt(localStorage.getItem("sixiang_save_v1") || "0", 10) || 0)); } catch(e) {}
function saveUnlock(){ try { localStorage.setItem("sixiang_save_v1", String(unlocked)); } catch(e) {} }

}

/* ---------------- 计数 / 设置 / 成绩 / 成就（全部本地，写失败不堵流程） ---------------- */
let runShifts = 0;              // 本轮全程移位次数
let levelShifts = 0, levelTime = 0, levelDeathsStart = 0;
let sfxOn = true;
const settings = { music: true, sfx: true };
try {
  const s = JSON.parse(localStorage.getItem("sixiang_settings_v1") || "null");
  if (s) { settings.music = s.music !== false; settings.sfx = s.sfx !== false; }
} catch(e) {}
sfxOn = settings.sfx;
function saveSettings(){ try { localStorage.setItem("sixiang_settings_v1", JSON.stringify(settings)); } catch(e) {} }

let records = { lv: [], run: { t: null, s: null } };
try {
  const r = JSON.parse(localStorage.getItem("sixiang_records_v1") || "null");
  if (r && Array.isArray(r.lv) && r.run) records = r;
} catch(e) {}
function saveRecords(){ try { localStorage.setItem("sixiang_records_v1", JSON.stringify(records)); } catch(e) {} }

const ACH = [
  { id: "first",  name: "第一步",   desc: "通关第 1 关" },
  { id: "half",   name: "过半",     desc: "通关第 4 关" },
  { id: "all",    name: "全境移位", desc: "通关全部 10 关" },
  { id: "clean",  name: "毫发无损", desc: "任意一关零死亡通关" },
  { id: "frugal", name: "精打细算", desc: "全程不超过 150 次移位通关" },
  { id: "swift",  name: "疾风",     desc: "全程 300 秒内通关" }
];
let achDone = [];
try { achDone = JSON.parse(localStorage.getItem("sixiang_ach_v1") || "[]"); if (!Array.isArray(achDone)) achDone = []; } catch(e) {}
let achToast = "";
function unlockAch(id){
  if (achDone.includes(id)) return;
  achDone.push(id);
  try { localStorage.setItem("sixiang_ach_v1", JSON.stringify(achDone)); } catch(e) {}
  const a = ACH.find(a => a.id === id);
  if (a) achToast = "成就达成 · " + a.name;
}
function commitLevel(){
  const rec = records.lv[levelIdx] || { t: null, s: null };
  if (rec.t === null || levelTime < rec.t) rec.t = Math.round(levelTime * 10) / 10;
  if (rec.s === null || levelShifts < rec.s) rec.s = levelShifts;
  records.lv[levelIdx] = rec; saveRecords();
  if (levelIdx === 0) unlockAch("first");
  if (levelIdx === 3) unlockAch("half");
  if (deaths === levelDeathsStart) unlockAch("clean");
}
function commitRun(){
  if (records.run.t === null || runTime < records.run.t) records.run.t = Math.round(runTime * 10) / 10;
  if (records.run.s === null || runShifts < records.run.s) records.run.s = runShifts;
  saveRecords();
  unlockAch("all");
  if (runShifts <= 150) unlockAch("frugal");
  if (runTime <= 300) unlockAch("swift");
}

function curState(){ return CONFIG.states[ring]; }
function platActive(p){ const s = curState().plat; return p.set === "AB" || p.set === s; }
function spikeActive(s){ return s.set === curState().plat; }

function loadLevel(i){
  levelIdx = i; level = LEVELS[i];
  ring = 0; tutIdx = 0; shiftCD = 0;
  levelShifts = 0; levelTime = 0; levelDeathsStart = deaths;
  player.x = level.spawn.x; player.y = level.spawn.y;
  player.vx = 0; player.vy = 0; player.grounded = false;
  camX = 0; particles = [];
}
function respawn(){
  player.x = level.spawn.x; player.y = level.spawn.y;
  player.vx = 0; player.vy = 0;
  ring = 0; shiftCD = 0;
}

let denyT = 0; // ratchet deny feedback timer
let shiftCD = 0; // 移位冷却（秒）：防连切悬浮/穿刺——切档后 0.4s 内再切无效
function ratchetZones(){
  const z = [];
  if (level.ratchet) z.push(level.ratchet);
  if (level.ratchet2) z.push(level.ratchet2);
  return z;
}
function inRatchet(){
  return ratchetZones().some(r => player.x >= r.x0 && player.x <= r.x1);
}
/* THE single entry point that may change the world state.
   Ratchet zones are the one exception to free shifting: inside them the
   ring only moves forward — backshift is denied (with feedback). */
function shift(dir){
  if (shiftCD > 0) return;
  if (dir < 0 && inRatchet()){
    denyT = 1.0; shake = Math.max(shake, 4); sfx("deny");
    return;
  }
  ring = (ring + dir + CONFIG.states.length) % CONFIG.states.length;
  shiftCD = 0.4;
  runShifts++; levelShifts++;
  flash = 0.35; shake = Math.max(shake, 3);
  burst(player.x + 15, player.y + 15, curState().plat === "A" ? curState().platA : curState().platB);
  sfx("shift", dir);
}

/* ---------------- audio (tiny synth) ---------------- */
let AC = null;
function audio(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state === "suspended") AC.resume(); }
function tone(f0, f1, dur, type, vol){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type || "square"; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
  g.gain.setValueAtTime(vol || 0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
}
function sfx(kind, dir){
  if (!AC || !sfxOn) return;
  if (kind === "deny")  { tone(140, 90, 0.15, "sawtooth", 0.06); }
  if (kind === "shift") { tone(dir > 0 ? 320 : 520, dir > 0 ? 640 : 260, 0.12, "square", 0.05); }
  if (kind === "die")   { tone(300, 60, 0.25, "sawtooth", 0.07); }
  if (kind === "goal")  { tone(523, 523, 0.09, "square", 0.05); setTimeout(()=>tone(659,659,0.09,"square",0.05), 90); setTimeout(()=>tone(784,784,0.16,"square",0.05), 180); }
}

/* Chiptune loop: tiny lookahead sequencer, all synthesized (no audio files).
   Am – F – C – G, bass + arpeggio. Starts on game start, M toggles it. */
const Music = (() => {
  let started = false, muted = false, step = 0, nextT = 0, timer = null;
  const BPM = 116, EIGHTH = 60 / BPM / 2;
  const BASS = [45, 41, 48, 43];                    // A2 F2 C3 G2, one bar each
  const ARP  = [[57,60,64,69],[53,57,60,65],[55,60,64,67],[55,59,62,67]];
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, dur, type, vol, dest){
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = mf(m);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
  }
  function schedule(){
    if (!AC) return;
    while (nextT < AC.currentTime + 0.25){
      const bar = Math.floor(step / 8) % 4, s8 = step % 8;
      if (!muted){
        const master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
        if (s8 === 0 || s8 === 3 || s8 === 6) note(BASS[bar], nextT, 0.22, "triangle", 0.20, master);
        if (s8 === 4) note(BASS[bar] + 7, nextT, 0.18, "triangle", 0.14, master);
        const arpNotes = ARP[bar];
        note(arpNotes[step % 4], nextT, 0.12, "square", 0.045, master);
        if (step % 16 === 14) note(arpNotes[3] + 12, nextT, 0.2, "square", 0.04, master);
      }
      step++; nextT += EIGHTH;
    }
  }
  return {
    start(){ if (started || !AC) return; started = true; step = 0; nextT = AC.currentTime + 0.06; timer = setInterval(schedule, 90); },
    toggle(){ muted = !muted; return muted; },
    setMuted(m){ muted = !!m; },
    get muted(){ return muted; }
  };
})();

/* ---------------- input ---------------- */
function pressShift(dir){
  audio();
  if (screen === "title" && titlePanel) { titlePanel = null; return; }
  if (screen === "title") { runTime = 0; deaths = 0; runShifts = 0; achToast = ""; screen = "play"; loadLevel(0); Music.start(); return; }
  if (screen === "win")   { screen = "title"; return; }
  if (screen !== "play") return;
  shift(dir);
}
window.addEventListener("keydown", (e) => {
  if (e.code === "ShiftLeft")  { if (!e.repeat) pressShift(1);  e.preventDefault(); }
  if (e.code === "ShiftRight") { if (!e.repeat) pressShift(-1); e.preventDefault(); }
  if (e.code === "KeyR" && screen === "play") { deaths++; respawn(); }
  if (e.code === "KeyM") { audio(); settings.music = !Music.toggle(); saveSettings(); }
  if (e.code === "Escape" && screen === "title") titlePanel = null;
  if (screen === "title" && /^Digit\d$/.test(e.code)) { const i = e.code === "Digit0" ? 9 : +e.code.slice(5) - 1; if (i < LEVELS.length && i <= unlocked) startLevel(i); }
});
let padL = null, padR = null; // touch/mouse pads drawn on canvas, hit-tested below
cv.addEventListener("pointerdown", (e) => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (CONFIG.viewW / r.width);
  const y = (e.clientY - r.top)  * (CONFIG.viewH / r.height);
  if (screen === "title"){
    if (titlePanel) { titlePanel = null; return; }
    for (const b of uiBtns){
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h){
        if (b.id === "music") { audio(); settings.music = !Music.toggle(); saveSettings(); }
        else if (b.id === "sfx") { sfxOn = !sfxOn; settings.sfx = sfxOn; saveSettings(); if (sfxOn) sfx("goal"); }
        else if (b.id === "board") titlePanel = "board";
        else if (b.id === "ach") titlePanel = "ach";
        return;
      }
    }
    for (const b of titleBtns){
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h){
        if (b.i <= unlocked) startLevel(b.i);
        return;
      }
    }
  }
  if (padL && x >= padL.x && x <= padL.x + padL.w && y >= padL.y && y <= padL.y + padL.h) pressShift(-1);
  else if (padR && x >= padR.x && x <= padR.x + padR.w && y >= padR.y && y <= padR.y + padR.h) pressShift(1);
  else if (screen !== "play") pressShift(1);
});
window.addEventListener("blur", () => { /* keys are event-driven; nothing sticks */ });

/* ---------------- physics ---------------- */
function burst(x, y, color){
  for (let i = 0; i < 14; i++){
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 130;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45, color });
  }
}
function overlaps(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function step(dt){
  if (screen === "clear") { clearTimer -= dt; if (clearTimer <= 0) { if (levelIdx + 1 > unlocked) { unlocked = Math.min(levelIdx + 1, LEVELS.length - 1); saveUnlock(); } if (levelIdx + 1 < LEVELS.length) { loadLevel(levelIdx + 1); screen = "play"; } else { commitRun(); screen = "win"; } } }
  if (screen !== "play") return;
  runTime += dt; levelTime += dt;
  if (shiftCD > 0) shiftCD -= dt;
  const st = curState(), S = CONFIG.playerSize, PH = 22;
  player.vx = CONFIG.runSpeed;
  player.vy += CONFIG.gravity * st.grav * dt;
  player.vy = Math.max(-CONFIG.maxFall, Math.min(CONFIG.maxFall, player.vy));

  // Platforms are one-way surfaces in the gravity axis: no side collision.
  // (Solid AABB sides pin the player on platform corners at state seams —
  //  see BUG_LOG 2026-11-21. Swept landing on the gravity-facing surface only.)
  const prevY = player.y;
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.grounded = false;
  for (const p of level.platforms){
    if (!platActive(p)) continue;
    if (player.x + S <= p.x || player.x >= p.x + p.w) continue;
    if (st.grav > 0 && player.vy >= 0 && prevY + S <= p.y + 0.01 && player.y + S >= p.y){
      player.y = p.y - S; player.vy = 0; player.grounded = true;
    } else if (st.grav < 0 && player.vy <= 0 && prevY >= p.y + PH - 0.01 && player.y <= p.y + PH){
      player.y = p.y + PH; player.vy = 0; player.grounded = true;
    }
  }
  let box = { x: player.x, y: player.y, w: S, h: S };
  // spikes
  box = { x: player.x + 5, y: player.y + 5, w: S - 10, h: S - 10 };
  for (const s of level.spikes){
    if (!spikeActive(s)) continue;
    const sb = s.hang ? { x: s.x, y: s.y, w: 26, h: 20 } : { x: s.x, y: s.y - 20, w: 26, h: 20 };
    if (overlaps(box, sb)) { die(); return; }
  }
  // fell / flew out
  if (player.y > CONFIG.killBelowY || player.y < CONFIG.killAboveY) { die(); return; }
  // goal (zone box; works for floor flags and ceiling flags)
  const g = level.goal;
  if (overlaps({ x: player.x, y: player.y, w: S, h: S }, g)){
    commitLevel();
    sfx("goal"); screen = "clear"; clearTimer = 1.1;
  }
  tutAdvance();
  camX = Math.max(0, Math.min(level.width - CONFIG.viewW, player.x - 300));
  // particles
  for (const pt of particles){ pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt; }
  particles = particles.filter(pt => pt.life > 0);
  if (flash > 0) flash -= dt;
  if (denyT > 0) denyT -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 14);
}
function die(){ deaths++; sfx("die"); burst(player.x + 15, player.y + 15, "#ff5d5d"); respawn(); }

/* ---------------- render ---------------- */
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function draw(){
  const st = curState(), W = CONFIG.viewW, H = CONFIG.viewH;
  ctx.fillStyle = st.sky; ctx.fillRect(0, 0, W, H);
  const sx = shake ? (Math.random() - 0.5) * shake : 0;
  const sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.save(); ctx.translate(-camX + sx, sy);
  // far silhouettes
  ctx.fillStyle = st.far;
  for (let i = 0; i < 14; i++){ const bx = i * 260 + 40; ctx.fillRect(bx, 300 - (i % 3) * 40, 90, 260); }
  // ratchet zone stripes
  for (const r of ratchetZones()){
    ctx.fillStyle = "rgba(255,92,92,0.06)"; ctx.fillRect(r.x0, 0, r.x1 - r.x0, CONFIG.viewH);
    ctx.strokeStyle = "rgba(255,92,92,0.35)"; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(r.x0, 0); ctx.lineTo(r.x0, CONFIG.viewH); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "rgba(255,120,120,0.8)"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "left";
    ctx.fillText("⇢ 棘轮区 — 只能向前", r.x0 + 12, 90);
  }
  // ghost (inactive) platforms first
  for (const p of level.platforms){
    if (platActive(p)) continue;
    ctx.strokeStyle = p.set === "A" ? st.platA : st.platB;
    ctx.globalAlpha = 0.35; ctx.setLineDash([7, 7]); ctx.lineWidth = 2;
    ctx.lineDashOffset = -performance.now() / 28;
    ctx.strokeRect(p.x, p.y, p.w, 22); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  // active platforms
  for (const p of level.platforms){
    if (!platActive(p)) continue;
    ctx.fillStyle = p.set === "B" ? st.platB : st.platA;
    if (p.set === "AB") ctx.fillStyle = "#8d99ae";
    rr(p.x, p.y, p.w, 22, 5); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fillRect(p.x, p.y, p.w, 4);
  }
  // spikes
  for (const s of level.spikes){
    if (!spikeActive(s)) { ctx.globalAlpha = 0.3; }
    ctx.fillStyle = "#ff5d5d";
    ctx.beginPath();
    if (s.hang){ ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + 13, s.y + 20); ctx.lineTo(s.x + 26, s.y); }
    else { ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + 13, s.y - 20); ctx.lineTo(s.x + 26, s.y); }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  }
  // goal flag (stands on a floor surface, or hangs from a ceiling one)
  const g = level.goal;
  if (g.ceil){
    ctx.fillStyle = "#e9ecef"; ctx.fillRect(g.x + 15, g.surf, 4, 62);
    ctx.fillStyle = "#51cf66"; ctx.beginPath();
    ctx.moveTo(g.x + 19, g.surf + 34); ctx.lineTo(g.x + 49, g.surf + 48); ctx.lineTo(g.x + 19, g.surf + 62);
  } else {
    ctx.fillStyle = "#e9ecef"; ctx.fillRect(g.x + 15, g.surf - 92, 4, 92);
    ctx.fillStyle = "#51cf66"; ctx.beginPath();
    ctx.moveTo(g.x + 19, g.surf - 92); ctx.lineTo(g.x + 49, g.surf - 78); ctx.lineTo(g.x + 19, g.surf - 64);
  }
  ctx.closePath(); ctx.fill();
  // player
  const S = CONFIG.playerSize;
  ctx.fillStyle = st.player; rr(player.x, player.y, S, S, 8); ctx.fill();
  ctx.fillStyle = "#14142b";
  const ey = st.grav > 0 ? player.y + 11 : player.y + S - 15;
  ctx.beginPath(); ctx.arc(player.x + 20, ey, 4, 0, Math.PI * 2); ctx.fill();
  // particles
  for (const pt of particles){ ctx.globalAlpha = Math.max(pt.life, 0) * 1.8; ctx.fillStyle = pt.color; ctx.fillRect(pt.x - 3, pt.y - 3, 6, 6); }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (flash > 0){ ctx.fillStyle = "rgba(255,255,255," + (flash * 0.5) + ")"; ctx.fillRect(0, 0, W, H); }

  if (screen === "play" || screen === "clear") drawHUD();
  if (screen === "title") drawTitle();
  if (screen === "clear") centerText("过关！", achToast, "#51cf66");
  if (screen === "win") drawWin();
  // touch pads
  padL = { x: 16, y: H - 92, w: 196, h: 74 }; padR = { x: W - 212, y: H - 92, w: 196, h: 74 };
  if (screen === "play"){
    ctx.globalAlpha = 0.55; ctx.fillStyle = "#ffffff";
    rr(padL.x, padL.y, padL.w, padL.h, 14); ctx.fill();
    rr(padR.x, padR.y, padR.w, padR.h, 14); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = "#14142b"; ctx.font = "bold 21px system-ui"; ctx.textAlign = "center";
    ctx.fillText("◀ 后移", padL.x + padL.w / 2, padL.y + 46);
    ctx.fillText("前移 ▶", padR.x + padR.w / 2, padR.y + 46);
  }
  drawTut();
}

function drawWin(){
  const W = CONFIG.viewW, H = CONFIG.viewH;
  ctx.fillStyle = "rgba(5,6,16,0.8)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#51cf66"; ctx.font = "bold 52px system-ui";
  ctx.fillText("全部移位完成", W / 2, 216);
  ctx.fillStyle = "#dfe3ee"; ctx.font = "20px system-ui";
  ctx.fillText("用时 " + runTime.toFixed(1) + " 秒 · 移位 " + runShifts + " 次 · 死亡 " + deaths + " 次", W / 2, 268);
  if (achToast){
    ctx.fillStyle = "#ffd166"; ctx.font = "16px system-ui";
    ctx.fillText(achToast, W / 2, 306);
  }
  ctx.fillStyle = "#8d99ae"; ctx.font = "15px system-ui";
  ctx.fillText("点任意处回到标题", W / 2, 362);
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now){
  const dt = Math.min((now - last) / 1000, 0.033); last = now;
  step(dt); draw();
  requestAnimationFrame(frame);
}
if (!settings.music) Music.setMuted(true);
loadLevel(0);
requestAnimationFrame(frame);

/* test hooks (read state + use the real controls) */
window.__game = {
  get screen(){ return screen; }, get ring(){ return ring; },
  get level(){ return levelIdx; }, get deaths(){ return deaths; },
  get unlocked(){ return unlocked; },
  get runShifts(){ return runShifts; },
  get records(){ return records; },
  get ach(){ return achDone.slice(); },
  get player(){ return { x: player.x, y: player.y, grounded: player.grounded }; },
  get tut(){ return { idx: tutIdx, total: tutSteps().length, current: tutCurrent() ? tutCurrent().text : null }; },
  pressShift, loadLevel: (i) => { loadLevel(i); screen = "play"; }
};
</script>
